<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E623E"/>
      <stop offset="50%" stop-color="#094A2D"/>
      <stop offset="100%" stop-color="#052E1B"/>
    </linearGradient>
    <linearGradient id="mGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#148052"/>
      <stop offset="100%" stop-color="#0B5233"/>
    </linearGradient>
    <linearGradient id="mFlagGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <radialGradient id="mBallGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </radialGradient>
  </defs>

  <!-- Full Bleed Background for Maskable Icon -->
  <rect width="512" height="512" fill="url(#mBgGrad)"/>

  <!-- Safe Zone Elements (scaled to fit within central 80%) -->
  <g transform="translate(25, 20) scale(0.9)">
    <!-- Radar Rings -->
    <circle cx="270" cy="380" r="140" fill="none" stroke="#34D399" stroke-opacity="0.15" stroke-width="3" stroke-dasharray="8 8"/>
    
    <!-- Putting Green Turf -->
    <ellipse cx="270" cy="380" rx="145" ry="42" fill="url(#mGreenGrad)"/>

    <!-- Cup -->
    <ellipse cx="270" cy="385" rx="34" ry="13" fill="#03150C"/>
    <ellipse cx="270" cy="383" rx="28" ry="8" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2"/>

    <!-- Flagpole -->
    <line x1="270" y1="384" x2="270" y2="100" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <circle cx="270" cy="98" r="9" fill="#FBBF24"/>

    <!-- Flag Pennant -->
    <path d="M276 106 C318 94, 362 124, 404 112 C410 110, 414 114, 412 120 C390 160, 350 158, 276 182 Z" 
          fill="url(#mFlagGrad)"/>

    <!-- Golf Ball -->
    <circle cx="188" cy="376" r="30" fill="url(#mBallGrad)"/>
    <circle cx="178" cy="366" r="2.8" fill="#94A3B8" fill-opacity="0.45"/>
    <circle cx="188" cy="362" r="2.8" fill="#94A3B8" fill-opacity="0.45"/>
    <circle cx="198" cy="366" r="2.8" fill="#94A3B8" fill-opacity="0.45"/>
    <circle cx="172" cy="374" r="2.8" fill="#94A3B8" fill-opacity="0.45"/>
    <circle cx="184" cy="372" r="3.0" fill="#94A3B8" fill-opacity="0.45"/>
    <circle cx="194" cy="372" r="3.0" fill="#94A3B8" fill-opacity="0.45"/>
    <circle cx="204" cy="376" r="2.8" fill="#94A3B8" fill-opacity="0.45"/>
    <circle cx="178" cy="384" r="2.8" fill="#94A3B8" fill-opacity="0.45"/>
    <circle cx="188" cy="384" r="3.0" fill="#94A3B8" fill-opacity="0.45"/>
    <circle cx="198" cy="384" r="2.8" fill="#94A3B8" fill-opacity="0.45"/>
  </g>
</svg>
